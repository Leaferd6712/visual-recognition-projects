<!DOCTYPE html>
<html>
<head>
    <title>Thank You — Visual Recognition Projects</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
        body {
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2em;
            font-family: "Source Sans Pro", Helvetica, sans-serif;
        }
        
        .thank-you-container {
            text-align: center;
            max-width: 600px;
            padding: 3em 2em;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        
        .thank-you-icon {
            font-size: 4em;
            margin-bottom: 0.5em;
            display: block;
        }
        
        h2 {
            font-size: 2.2em;
            color: #2ecc71;
            margin: 0.3em 0 0.1em;
            font-weight: 700;
            letter-spacing: 0.08em;
        }
        
        .thank-you-message {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1em;
            margin: 1.5em 0 2.2em;
            line-height: 1.6;
        }
        
        a {
            display: inline-block;
            padding: 0.8em 1.8em;
            background: linear-gradient(135deg, #5b52e0, #6c63ff);
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.08em;
            font-size: 0.85em;
            text-transform: uppercase;
            transition: filter 0.2s ease, transform 0.15s ease;
            border: 1px solid rgba(107, 99, 255, 0.4);
        }
        
        a:hover {
            filter: brightness(1.15);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <span class="thank-you-icon">✅</span>
        <h2>Thank You!</h2>
        <p class="thank-you-message">
            Your message has been received. I'll get back to you as soon as possible.
        </p>
        <a href="index.html">← Return to Portfolio</a>
    </div>
</body>
</html>
